<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node.js Docker Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            transition: 0.4s;
        }

        body.light {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            color: #222;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #00e5ff;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            background: #00e5ff;
            color: #111;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.4);
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #00e5ff;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.8;
        }

        .container {
            width: 85%;
            max-width: 1100px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.15);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .counter {
            font-size: 45px;
            margin: 20px;
            color: #00e5ff;
        }

        .status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            background: #1dd75b;
            color: #061b0d;
            font-weight: bold;
        }

        .actions {
            margin-top: 40px;
            text-align: center;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 25px;
        }

        footer {
            text-align: center;
            padding: 50px 20px 30px;
            opacity: 0.6;
        }

        @media(max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 38px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        NODE<span>DOCKER</span>
    </div>

    <button onclick="toggleTheme()">
        🌙 Toggle Theme
    </button>

</header>


<section class="hero">

    <h1>
        Node.js <span>Docker</span> Dashboard
    </h1>

    <p>
        An interactive website running inside a Docker container
    </p>

</section>


<div class="container">

    <div class="cards">

        <div class="card">

            <div class="icon">🚀</div>

            <h2>Application</h2>

            <p>
                Node.js + Express
            </p>

            <br>

            <span class="status">
                ● ONLINE
            </span>

        </div>


        <div class="card">

            <div class="icon">🐳</div>

            <h2>Container</h2>

            <p>
                Docker Container
            </p>

            <br>

            <span class="status">
                ● RUNNING
            </span>

        </div>


        <div class="card">

            <div class="icon">⚡</div>

            <h2>Server Time</h2>

            <p id="serverTime">
                Loading...
            </p>

        </div>

    </div>


    <div class="actions">

        <h2>Interactive Counter</h2>

        <div class="counter" id="counter">
            0
        </div>

        <button onclick="increaseCounter()">
            + Increase
        </button>

        <button onclick="resetCounter()">
            Reset
        </button>

        <br><br>

        <button onclick="checkServer()">
            🔌 Check Node.js Server
        </button>

        <div id="message"></div>

    </div>

</div>


<footer>

    Node.js • Express • Docker

</footer>


<script>

let count = 0;


function increaseCounter() {

    count++;

    document.getElementById("counter").innerText = count;

}


function resetCounter() {

    count = 0;

    document.getElementById("counter").innerText = count;

}


function toggleTheme() {

    document.body.classList.toggle("light");

}


async function checkServer() {

    const message = document.getElementById("message");

    message.innerText = "Connecting to Node.js server...";

    try {

        const response = await fetch("/api/status");

        const data = await response.json();

        message.innerHTML =
            "✅ " + data.message +
            "<br>Server Time: " + data.time;

        document.getElementById("serverTime").innerText =
            data.time;

    } catch (error) {

        message.innerText =
            "❌ Cannot connect to server";

    }

}


setInterval(() => {

    const now = new Date();

    document.getElementById("serverTime").innerText =
        now.toLocaleTimeString();

}, 1000);


</script>

</body>
</html>
